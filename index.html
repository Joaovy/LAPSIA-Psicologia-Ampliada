<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAPSIA · Sistema de Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9.5 2a5.5 5.5 0 0 0-4.9 8.02A4.5 4.5 0 0 0 6 18.5V20a2 2 0 0 0 2 2h1v-3M14.5 2a5.5 5.5 0 0 1 4.9 8.02A4.5 4.5 0 0 1 18 18.5V20a2 2 0 0 1-2 2h-1v-3M9.5 2c1.4 0 2.5 1.6 2.5 3.5S10.9 9 9.5 9M14.5 2c-1.4 0-2.5 1.6-2.5 3.5"/>
      </svg>
    </div>
    <h1>LAPSIA</h1>
    <div class="subtitle">Psicologia Ampliada · UNITRI</div>
    <div class="login-card">
      <div class="field">
        <label>E-mail</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
          <input type="text" id="login-email" autocomplete="username">
        </div>
      </div>
      <div class="field">
        <label>Senha</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="login-senha" autocomplete="current-password">
        </div>
      </div>
      <button class="login-btn" id="login-btn" onclick="handleLogin()">Entrar</button>
      <div class="login-error" id="login-error"></div>
    </div>
    <div class="login-footer">Acesso restrito · Sistema de Gestão LAPSIA</div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <aside id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9.5 2a5.5 5.5 0 0 0-4.9 8.02A4.5 4.5 0 0 0 6 18.5V20a2 2 0 0 0 2 2h1v-3M14.5 2a5.5 5.5 0 0 1 4.9 8.02A4.5 4.5 0 0 1 18 18.5V20a2 2 0 0 1-2 2h-1v-3M9.5 2c1.4 0 2.5 1.6 2.5 3.5S10.9 9 9.5 9M14.5 2c-1.4 0-2.5 1.6-2.5 3.5"/>
        </svg>
      </div>
      <div class="brand-text">
        <b>LAPSIA</b>
        <span>Psicologia Ampliada · UNITRI</span>
      </div>
    </div>
    <div id="sidebar-scroll"></div>
    <div id="sidebar-footer">LAPSIA · Sistema de Gestão</div>
  </aside>

  <div id="main-col">
    <div id="topbar">
      <div class="crumb" id="crumb-text">Dashboard</div>
      <div class="sair" onclick="handleLogout()">Sair</div>
    </div>
    <div id="main"></div>
  </div>
</div>

<!-- ============ MODAL DE AVALIAÇÃO ============ -->
<div class="modal-overlay" id="eval-modal">
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="eval-modal-title">Avaliação</h2>
      <button class="modal-close" onclick="closeEvalModal()">&times;</button>
    </div>
    <div class="modal-body" id="eval-modal-body"></div>
  </div>
</div>

<!-- ============ TOASTS ============ -->
<div id="toast-host"></div>

<!-- Dependências externas -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/vendor/pptxgen.min.js"></script>

<!-- Módulos da aplicação (ordem de carregamento importa) -->
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/overlay.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/render.js"></script>
<script src="js/boot.js"></script>

</body>
</html>
